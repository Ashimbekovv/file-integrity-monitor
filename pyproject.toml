[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-integrity-monitor"
version = "1.1.0"
description = "Educational SHA-256 file integrity monitor with authenticated baselines"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
fim = "fim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
